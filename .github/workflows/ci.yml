name: dotnet-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject saved notebook output
        run: python3 eng/check-notebook-outputs.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore ms-agent-framework-redis.slnx
      - run: dotnet format ms-agent-framework-redis.slnx --verify-no-changes --no-restore
      - run: dotnet build ms-agent-framework-redis.slnx -c Release --no-restore
      - run: dotnet test ms-agent-framework-redis.slnx -c Release --no-build
      - run: python3 eng/test-package-validation.py
      - run: python3 eng/test-release-recovery.py
      - run: ./eng/pack.sh
      - run: ./eng/package-smoke.sh
  agent-framework-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        agent-framework-version: ["1.19.0", "1.23.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Test connector compatibility
        run: dotnet test tests/Redis.Iris.AgentFramework.Tests/Redis.Iris.AgentFramework.Tests.csproj -c Release -p:AgentFrameworkVersion=${{ matrix.agent-framework-version }}
  sample-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 eng/test-docker-context.py
      - run: docker build -f samples/RedisIrisDevUI/Dockerfile --target context-seeder -t iris-context-tools .
      - run: docker run --rm --entrypoint dotnet iris-context-tools /app/publish/RedisIrisDevUI.dll --print-context-model
      - run: docker run --rm --entrypoint dotnet iris-context-tools /app/publish/RedisIrisDevUI.dll --print-context-seed
