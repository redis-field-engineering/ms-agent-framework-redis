name: preview-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing preview tag reachable from main (v0.1.0-preview.1)
        required: true
        type: string
      publish:
        description: Publish validated packages to NuGet
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: preview-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      commit: ${{ steps.select.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and select release tag
        id: select
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$ ]] || { echo 'Expected a preview version tag'; exit 1; }
          commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          git merge-base --is-ancestor "$commit" origin/main
          git checkout --detach "$commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore ms-agent-framework-redis.slnx
      - run: dotnet format ms-agent-framework-redis.slnx --verify-no-changes --no-restore
      - run: dotnet build ms-agent-framework-redis.slnx -c Release --no-restore
      - run: dotnet test ms-agent-framework-redis.slnx -c Release --no-build --filter "Category!=Live"
      - run: python3 eng/test-package-validation.py
      - run: python3 eng/test-release-recovery.py
      - run: ./eng/pack.sh
      - name: Verify package version matches tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: test "v$(./eng/validate-packages.sh artifacts/packages)" = "$RELEASE_TAG"
      - run: ./eng/package-smoke.sh
      - name: Record validated artifact provenance
        env:
          RELEASE_COMMIT: ${{ steps.select.outputs.commit }}
        run: python3 eng/release-packages.py manifest artifacts/packages --commit "$RELEASE_COMMIT"
      - uses: actions/upload-artifact@v4
        with:
          name: validated-preview-packages
          path: artifacts/packages/
          if-no-files-found: error
          retention-days: 90
  publish:
    if: inputs.publish
    needs: validate
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: validated-preview-packages
          path: packages
      - name: Authenticate to NuGet with trusted publishing
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish the validated dependency set
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          python3 eng/release-packages.py publish packages --commit "$RELEASE_COMMIT"
