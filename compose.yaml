name: redis-iris-devui

services:
  context-provisioner:
    profiles: ["context-retriever"]
    build:
      context: .
      dockerfile: samples/RedisIrisDevUI/Dockerfile
      target: context-provisioner
    env_file:
      - path: .env.local
        required: true
    environment:
      CONTEXT_RETRIEVER_ARTIFACT_DIR: /artifacts/context-retriever
    volumes:
      - ./artifacts:/artifacts
    restart: "no"

  context-seeder:
    profiles: ["context-retriever"]
    build:
      context: .
      dockerfile: samples/RedisIrisDevUI/Dockerfile
      target: context-seeder
    env_file:
      - path: .env.local
        required: true
    environment:
      CONTEXT_RETRIEVER_ARTIFACT_DIR: /artifacts/context-retriever
    volumes:
      - ./artifacts:/artifacts
    restart: "no"

  devui:
    build:
      context: .
      dockerfile: samples/RedisIrisDevUI/Dockerfile
    env_file:
      - path: .env.local
        required: true
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_METRIC_EXPORT_INTERVAL: 5000
      OTEL_SERVICE_NAME: redis-iris-devui
      REDIS_IRIS_DEMO_TELEMETRY: "false"
      DEVUI_ALLOW_REMOTE_ACCESS: "true"
      DEVUI_USERS_FILE: /run/redis-iris/context-retriever/redis-iris-travel-users.json
    volumes:
      - ./artifacts/context-retriever:/run/redis-iris/context-retriever:ro
    ports:
      - "127.0.0.1:5080:8080"
    depends_on:
      otel-collector:
        condition: service_started
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.140.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      jaeger:
        condition: service_started
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:8889:8889"
    restart: unless-stopped

  jaeger:
    image: jaegertracing/jaeger:2.21.0
    ports:
      - "127.0.0.1:16686:16686"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.7.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      otel-collector:
        condition: service_started
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
