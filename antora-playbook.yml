site:
  title: Redis Iris for .NET
  url: https://redis-field-engineering.github.io/ms-agent-framework-redis
  start_page: redis-iris:ROOT:index.adoc
  robots: allow
content:
  sources:
    - url: .
      branches: HEAD
      start_path: docs
      edit_url: https://github.com/redis-field-engineering/ms-agent-framework-redis/edit/main/{path}
ui:
  bundle:
    url: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/master/raw/build/ui-bundle.zip?job=bundle-stable
    snapshot: true
  supplemental_files: ./docs/supplemental-ui
antora:
  extensions:
    - require: '@antora/lunr-extension'
      index_by_heading: true
asciidoc:
  attributes:
    page-pagination: ''
    idprefix: ''
    idseparator: '-'
    source-language: csharp
    experimental: ''
    sectanchors: ''
urls:
  html_extension_style: default
  redirect_facility: static
output:
  dir: ./build/site
runtime:
  cache_dir: ./.cache/antora
  log:
    failure_level: warn
